name: Build

on:
  push:
    branches: [main, test]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # (only used by the release step, on tags)

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build RiseBridge.exe
        shell: pwsh
        run: |
          python -m pip install cryptography pyinstaller
          python rise-bridge/tests/test_app.py
          python rise-bridge/tests/test_memberid.py
          python rise-bridge/tests/test_lobby.py
          python -m PyInstaller --noconfirm --onefile --windowed --name RiseBridge --paths rise-bridge --paths rise-bridge/tools rise-bridge/rise_bridge_app.py
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item build/Release/dinput8.dll out/
          Copy-Item build/Release/rise_crossplay.dll out/
          Copy-Item quest/rise_crossplay_quest.lua out/
          New-Item -ItemType Directory -Force out/probe | Out-Null
          # The port's Add a mod takes a zip laid out like the game folder
          New-Item -ItemType Directory -Force probe-zip/reframework/autorun | Out-Null
          Copy-Item probe/crossplay_probe.lua probe-zip/reframework/autorun/
          Compress-Archive -Path probe-zip/reframework -DestinationPath out/probe/crossplay-probe.zip -Force
          Copy-Item probe/crossplay_probe.lua out/probe/
          Copy-Item dist/RiseBridge.exe out/
          Copy-Item BRIDGE.md out/
          Copy-Item README.md out/
          Compress-Archive -Path out/* -DestinationPath rise-pc-netlog.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rise-pc-netlog
          path: out/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" rise-pc-netlog.zip --title "${{ github.ref_name }}" --notes "With REFramework: rise_crossplay.dll goes in reframework/plugins. Without it: dinput8.dll goes next to MonsterHunterRise.exe. See README."
